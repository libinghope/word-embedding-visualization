[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-atlas"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi", "uvicorn", "pydantic>=2", "numpy", "scipy", "scikit-learn", "umap-learn", "gensim"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

